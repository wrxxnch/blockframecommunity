name: CI / Build & Validate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Lint & Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Typecheck / Lint
        run: npm run lint

      - name: Build fullstack app (Client + Server)
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Verifying generated bundle artifacts..."
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          test -f dist/server.cjs || (echo "Missing dist/server.cjs" && exit 1)
          echo "All build outputs verified successfully!"
